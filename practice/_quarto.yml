project:
  type: website
  output-dir: _output
  resources:
  - materials/**
  - '!tools/**'
  - '!tests/**'
  - '!**/projects/**'
  - '!**/__pycache__/**'
  - '!**/*.qmd'
  - '!**/*.rmd'
  - '!**/*.ipynb'
  - '!_extensions/**'
  - '!_generated/**'
  - '!.quarto/**'
  - '!_freeze/**'
  - '!_output/**'
  - '!**/_output/**'
  - '!**/_generated/**'
  pre-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/pre.ts
  post-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/post.ts
  - _extensions/Afonenko-Course-Tools/reference-catalog/entrypoints/post.ts
  - ../_extensions/Afonenko-Course-Tools/course-site/entrypoints/collect.ts
  render:
  - index.qmd
  - work-environment.qmd
  - data-processing.qmd
  - version-control.qmd
format:
  revealjs:
    theme: default
    slide-level: 2
    navigation-mode: linear
    slide-number: true
    pdf-separate-fragments: false
    revealjs-plugins:
    - course-navigation
lang: ru
fail-if-warnings: true
filters:
- course-navigation
- course-core
- course-presentation
- reference-catalog
reference-catalog:
  namespace: system-practice-practice
profile:
  default: student
  group:
  - - student
    - full
website:
  title: System Practice — введения
  search: true
  navbar:
    left:
    - text: Курс
      href: ../index.html
    - text: Рабочая среда
      href: work-environment.qmd
course-navigation:
  course-url: https://bsu-rfct-afonenko-courses.github.io/System-Practice/
  links:
  - text: Курс
    href: /index.html
    scope: course
  - text: Введения
    href: /index.html
    scope: project
  - text: Условие
    href: /tasks/labs/work-environment.html
    scope: course
