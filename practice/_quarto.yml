project:
  type: website
  output-dir: _output
  resources:
  - '!**/*.qmd'
  - '!**/*.rmd'
  - '!**/*.ipynb'
  - '!_extensions/**'
  - '!_generated/**'
  - '!.quarto/**'
  - '!_freeze/**'
  - '!_output/**'
  - '!**/_output/**'
  - '!**/_generated/**'
  pre-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/pre.ts
  post-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/post.ts
  - _extensions/Afonenko-Course-Tools/reference-catalog/entrypoints/post.ts
  - ../_extensions/Afonenko-Course-Tools/course-site/entrypoints/collect.ts
  render:
  - index.qmd
  - 01.qmd
  - 02.qmd
  - 02-project.qmd
format:
  html:
    theme: cosmo
    toc: true
    code-copy: true
    code-tools: false
lang: ru
fail-if-warnings: true
filters:
- course-core
- course-presentation
- reference-catalog
reference-catalog:
  namespace: practice
profile:
  default: student
  group:
  - - student
    - full
website:
  title: System Practice — занятия
  search: true
  navbar:
    left:
    - text: Портал
      href: ../index.html
    - text: Занятие 1
      href: 01.qmd
    - text: Занятие 2
      href: 02.qmd
    - text: Проектная замена
      href: 02-project.qmd
