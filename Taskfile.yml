version: '3'
tasks:
  install:
    desc: Проверить зафиксированную vendor-поставку без переустановки
    cmds:
    - python3 tools/materialize-providers.py --check
  install:from-sources:
    desc: Воспроизвести exact release + local patch из заранее полученных checkouts
    requires:
      vars: [PROVIDERS_ROOT]
    cmds:
    - python3 tools/materialize-providers.py --providers-root '{{.PROVIDERS_ROOT}}' --write
    - python3 tools/materialize-providers.py --check
  test:providers:
    cmds:
    - python3 tools/test-materialize-providers.py
    - python3 tools/materialize-providers.py --check
  render:
    deps: [install]
    cmds:
    - quarto render --profile student
  render:full:
    deps: [install]
    cmds:
    - quarto render --profile full
  preview:
    deps: [install]
    cmds:
    - quarto preview --profile student --no-watch-inputs
  publish:
    deps: [install]
    cmds:
    - quarto render --profile student
    - quarto publish gh-pages --profile student --no-render
