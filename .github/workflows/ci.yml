name: Проверка курса

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Получить исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Установить Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b
        with:
          version: '1.11.5'
      - name: Подготовить оболочки для проверки готовых сценариев
        run: |
          sudo apt-get update
          sudo apt-get install --yes fish
          fish --version
          pwsh --version
      - name: Проверить учебные материалы и файловые договоры
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Собрать student
        run: timeout --signal=TERM --kill-after=5s 2700s quarto render --profile student --fail-if-warnings
