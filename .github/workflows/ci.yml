name: Проверка курса

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Получить исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Установить Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b
        with:
          version: '1.11.6'
      - name: Установить CUE
        uses: cue-lang/setup-cue@b0e30e540a2dae47304ebf16586a5b2db023b61c
        with:
          version: v0.17.1
      - name: Проверить точные tracked provider bytes и safe materializer
        run: |
          python3 tools/materialize-providers.py --check
          python3 tools/test-materialize-providers.py
      - name: Собрать student
        run: quarto render --profile student --fail-if-warnings
      - name: Собрать full
        run: quarto render --profile full --fail-if-warnings
      - name: Вернуть student после full
        run: quarto render --profile student --fail-if-warnings
