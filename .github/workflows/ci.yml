name: Проверка курса

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Получить исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Установить Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b
        with:
          version: '1.11.6'
      - name: Установить CUE
        uses: cue-lang/setup-cue@b0e30e540a2dae47304ebf16586a5b2db023b61c
        with:
          version: v0.17.1
      - name: Проверить точные tracked provider bytes и safe materializer
        run: |
          python3 tools/materialize-providers.py --check
          python3 tools/test-materialize-providers.py
      - name: Подготовить оболочки для проверки готовых сценариев
        run: |
          sudo apt-get update
          sudo apt-get install --yes fish
          fish --version
          pwsh --version
      - name: Проверить учебные материалы и файловые договоры
        run: |
          python3 tools/build_materials.py --check
          python3 tools/build_materials.py --project data-processing --check
          python3 tools/build_git_materials.py --check
          python3 tools/build_maintenance_materials.py --check
          python3 tools/materialize_public_materials.py --check
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Собрать student
        run: quarto render --profile student --fail-if-warnings
      - name: Собрать full
        run: quarto render --profile full --fail-if-warnings
      - name: Вернуть student после full
        run: quarto render --profile student --fail-if-warnings
