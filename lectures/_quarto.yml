project:
  type: website
  output-dir: _output
  pre-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/pre.ts
  post-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/post.ts
  - _extensions/Afonenko-Course-Tools/reference-catalog/entrypoints/post.ts
  - ../_extensions/Afonenko-Course-Tools/course-site/entrypoints/collect.ts
  render:
  - index.qmd
  - work-environment.qmd
  - text-streams.qmd
  - object-pipeline.qmd
  - git-state.qmd
  - git-branches.qmd
  - project-maintenance.qmd
  resources:
  - '!tools/**'
  - '!tests/**'
  - '!**/projects/**'
  - '!**/__pycache__/**'
  - '!**/*.qmd'
  - '!**/*.rmd'
  - '!**/*.ipynb'
  - '!_extensions/**'
  - '!_generated/**'
  - '!.quarto/**'
  - '!_freeze/**'
  - '!_output/**'
  - '!**/_output/**'
  - '!**/_generated/**'
  - '!**/_site*/**'
profile:
  default: student
  group:
  - - student
    - full
filters:
- course-navigation
- course-core
- course-presentation
- reference-catalog
format:
  revealjs:
    css: assets/lesson.css
    slide-level: 2
    navigation-mode: linear
    theme: default
    slide-number: true
    pdf-separate-fragments: false
    revealjs-plugins:
    - course-navigation
lang: ru
reference-catalog:
  namespace: system-practice-lectures
fail-if-warnings: true
bibliography: ../bibliography/course.bib
csl: ../bibliography/numeric.csl
link-citations: true
website:
  title: Лекции System Practice
  navbar:
    left:
    - text: Курс
      href: ../index.html
    - text: Теория
      href: ../theory/index.html
course-navigation:
  course-url: https://bsu-rfct-afonenko-courses.github.io/System-Practice/
  links:
  - text: Курс
    href: /index.html
    scope: course
  - text: Лекции
    href: /index.html
    scope: project
  - text: Теория
    href: /theory/index.html
    scope: course
