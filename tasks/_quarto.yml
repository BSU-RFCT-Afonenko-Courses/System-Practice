project:
  type: book
  output-dir: _output
  resources:
  - '!**/*.qmd'
  - '!**/*.rmd'
  - '!**/*.ipynb'
  - '!_extensions/**'
  - '!_generated/**'
  - '!.quarto/**'
  - '!_freeze/**'
  - '!_output/**'
  - '!**/_output/**'
  - '!**/_generated/**'
  pre-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/pre.ts
  post-render:
  - _extensions/Afonenko-Course-Tools/course-core/entrypoints/post.ts
  - _extensions/Afonenko-Course-Tools/reference-catalog/entrypoints/post.ts
  - ../_extensions/Afonenko-Course-Tools/course-site/entrypoints/collect.ts
format:
  html:
    theme: cosmo
    toc: true
    code-copy: true
    code-tools: false
lang: ru
fail-if-warnings: true
filters:
- course-core
- course-presentation
- course-prairielearn
- reference-catalog
reference-catalog:
  namespace: tasks
profile:
  default: student
  group:
  - - student
    - full
book:
  title: System Practice — банк задач
  chapters:
  - index.qmd
  - topics/01-command-line.qmd
  - topics/02-files-streams.qmd
  - topics/03-diff-patch.qmd
  - topics/04-git.qmd
  - projects.qmd
  - prairielearn-pilot.qmd
  - sources.qmd
  search: true
  page-navigation: true
  sidebar:
    tools:
    - icon: house
      href: ../index.html#sec-system-practice
      text: Портал курса
course:
  adapters:
  - prairielearn
prairielearn:
  question-defaults:
    topic: Shell
    submission:
      mode: editor
      ace-mode: ace/mode/sh
  delivery:
    book: tasks
    course:
      name: SYSTEM-PRACTICE
      title: System Practice
      timezone: Europe/Minsk
      topics:
      - name: Shell
        color: blue2
        description: Файлы и потоки
    instances:
      pilot:
        title: Пилот System Practice
        self-enrollment: false
        publishing:
          start-date: '1970-01-01T00:00:00Z'
          end-date: '9999-12-31T00:00:00Z'
        works:
        - sec-pl-streams-pilot
project-checks:
  source-profiles:
    fish-answer:
      mode: implementation
      root: student
      include:
      - commands.fish
  profiles:
    streams:
      source-profile: fish-answer
      runtime: fish-git-v1
      tests:
      - checks.py
      - headers.txt
      limits:
        outer-seconds: 30
        run-seconds: 3
        networking: false
        max-output-bytes: 65536
      scoring:
        mode: weighted
      references:
      - name: default
        root: reference
        optional: false
      contract-cases: tests/contract-cases.json
